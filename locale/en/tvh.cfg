[mod-name]
factorio-the-voyage-home=Factorio: The Voyage Home

[mod-description]
factorio-the-voyage-home=Earn a one-way interstellar jump, carry one vessel of cargo beyond the Solar System Edge, and begin again in a freshly generated solar system.

[mod-setting-name]
tvh-discovery-distance-km=Signal discovery distance
tvh-cargo-capacity-multiplier=Vessel cargo capacity multiplier
tvh-development-commands=Enable development commands

[mod-setting-description]
tvh-discovery-distance-km=Distance, in kilometres, that a platform must travel from the Solar System Edge toward the Shattered Planet to discover the Interstellar Signal. The Interstellar Corridor uses the same length. Default: 100,000 km.
tvh-cargo-capacity-multiplier=Multiplies the default rocket lift weight to determine the Interstellar Vessel's authoritative cargo limit. The vessel can be loaded beyond this limit, but the jump cannot begin while it is overweight. Default: 1.0.
tvh-development-commands=Enables administrator-only commands that directly change mission progress. Leave disabled for normal play. The read-only status and reset dry-run commands remain available.

[item-name]
tvh-interstellar-vessel=Interstellar Vessel

[item-description]
tvh-interstellar-vessel=A 48-slot vessel that carries the only transferable cargo through the interstellar jump. It must be launched to and placed on a space platform. Cargo weight, rather than slot count, determines jump readiness.

[entity-name]
tvh-interstellar-vessel=Interstellar Vessel
tvh-arrival-cache=Interstellar Arrival Cache

[entity-description]
tvh-interstellar-vessel=The physical vessel for the voyage home. Place it on a space platform, load the cargo worth carrying into a new solar system, and bring it to the Interstellar Staging Point.
tvh-arrival-cache=A durable cache containing the cargo that survived the interstellar jump.

[recipe-name]
tvh-interstellar-vessel=Interstellar Vessel

[recipe-description]
tvh-interstellar-vessel=Constructs one Interstellar Vessel. Its cross-system components require an electromagnetic plant and ten minutes of uninterrupted assembly at base crafting speed.

[recipe-category-name]
tvh-interstellar-vessel-crafting=Interstellar vessel construction

[technology-name]
tvh-interstellar-signal=Interstellar Signal
tvh-interstellar-navigation=Interstellar Navigation

[technology-description]
tvh-interstellar-signal=A structured signal resolved in the darkness beyond the Solar System Edge. Its origin points toward a navigable route out of this solar system.
tvh-interstellar-navigation=Decode the signal, chart the Interstellar Staging Point, and develop a vessel capable of carrying selected cargo into a regenerated solar system.

[technology-trigger]
tvh-interstellar-signal=Travel __1__ km from the Solar System Edge toward the Shattered Planet.

[space-location-name]
tvh-interstellar-staging=Interstellar Staging Point

[space-location-description]
tvh-interstellar-staging=A charted point beyond the Solar System Edge where a platform may safely stop, wait, and turn back. An interstellar jump begins only after every readiness check passes and the engineer confirms the irreversible action.

[space-connection-name]
tvh-interstellar-corridor=Interstellar Corridor

[space-connection-description]
tvh-interstellar-corridor=The final proving route from the Solar System Edge to the Interstellar Staging Point. Its asteroid field mirrors the opening section of the route toward the Shattered Planet.

