[tips-and-tricks-item-name]
tvh-voyage-home=The Voyage Home

[tips-and-tricks-item-description]
tvh-voyage-home=Travel beyond the Solar System Edge to discover the Interstellar Signal. Research Interstellar Navigation, build and load a vessel, then bring both the vessel and engineer to the Interstellar Staging Point. The final jump is deliberate and irreversible within the current save; use the named pre-jump autosave as the recovery point.
